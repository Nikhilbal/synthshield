
services:
  postgres:
    networks:
      - backend_net

  policy-api:
    build:
      context: .
      dockerfile: Dockerfile.isolation
    command:
      - python
      - -m
      - uvicorn
      - src.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: synth_policy_runtime
      POSTGRES_PASSWORD: ${SYNTHSHIELD_POLICY_DB_PASSWORD:?Policy DB password required}
      SYNTHSHIELD_DB_HOST: postgres
      SYNTHSHIELD_DB_PORT: "5432"
      SYNTHSHIELD_AUDIT_HMAC_KEY: ${SYNTHSHIELD_AUDIT_HMAC_KEY:?HMAC key required}
      SYNTHSHIELD_READ_API_KEY: ${SYNTHSHIELD_READ_API_KEY}
    volumes:
      - isolation_audit_logs:/app/audit_logs
    networks:
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 10

  trusted-tool:
    build:
      context: .
      dockerfile: Dockerfile.isolation
    command:
      - python
      - -m
      - uvicorn
      - src.trusted_tool_service:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: synth_tool_runtime
      POSTGRES_PASSWORD: ${SYNTHSHIELD_TOOL_DB_PASSWORD:?Tool DB password required}
      SYNTHSHIELD_DB_HOST: postgres
      SYNTHSHIELD_DB_PORT: "5432"
      SYNTHSHIELD_AUDIT_HMAC_KEY: ${SYNTHSHIELD_AUDIT_HMAC_KEY:?HMAC key required}
      SYNTHSHIELD_EVALUATION_URL: http://policy-api:8000/v1/evaluate
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend_net
      - agent_net
    depends_on:
      policy-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8001), 2).close()"
      interval: 5s
      timeout: 5s
      retries: 10

  agent-lab:
    build:
      context: ./agent_lab
      dockerfile: Dockerfile
    environment:
      SYNTHSHIELD_TOOL_URL: http://trusted-tool:8001/v1/agent-tools/execute
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - agent_net
    depends_on:
      trusted-tool:
        condition: service_healthy

networks:
  backend_net:
  agent_net:

volumes:
  isolation_audit_logs:
